[package]
name = "tools-view"
version = "0.1.0"
description = "JSON / YAML / XML 格式化与可视化工具"
edition = "2021"

[lib]
name = "tools_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
quick-xml = "0.37"

[profile.release]
codegen-units = 1
lto = true
strip = true
